<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MK Academia — Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #2A7DE1;
      --blue-dark: #1A5FBF;
      --black: #111;
      --white: #fff;
      --gray: #f4f6fa;
      --gray2: #e8ecf4;
      --text: #222;
      --text2: #666;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray);
      color: var(--text);
      min-height: 100vh;
    }

    /* LOGIN */
    #login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    .login-box {
      background: var(--white);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: var(--blue);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }

    .login-box h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--black);
      margin-bottom: 6px;
    }

    .login-box p {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--gray2);
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--blue);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .login-btn:hover { background: var(--blue-dark); }
    .login-btn:active { transform: scale(0.98); }

    .error-msg {
      background: #fee2e2;
      color: var(--red);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }

    /* ADMIN PANEL */
    #admin-page { display: none; }

    .topbar {
      background: var(--white);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-logo {
      width: 36px;
      height: 36px;
      background: var(--blue);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .topbar-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 18px;
      color: var(--black);
    }

    .topbar-title span {
      color: var(--blue);
    }

    .logout-btn {
      padding: 8px 18px;
      background: var(--gray);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
      cursor: pointer;
      transition: background 0.2s;
    }

    .logout-btn:hover { background: var(--gray2); }

    .main-content {
      padding: 32px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--white);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text2);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: var(--black);
    }

    .stat-value.blue { color: var(--blue); }
    .stat-value.green { color: var(--green); }

    .leads-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .leads-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .leads-header h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 800;
    }

    .refresh-btn {
      padding: 8px 16px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .refresh-btn:hover { background: var(--blue-dark); }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: var(--gray);
    }

    th {
      padding: 12px 20px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 20px;
      font-size: 14px;
      border-bottom: 1px solid var(--gray2);
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: #f8faff; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #dbeafe;
      color: var(--blue);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--gray2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }

    .empty-icon { font-size: 40px; margin-bottom: 12px; }

    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr; }
      .main-content { padding: 16px; }
      .topbar { padding: 0 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-box">
    <div class="login-logo">🎓</div>
    <h1>MK Academia</h1>
    <p>Admin panelga kirish</p>
    <div class="input-group">
      <label>Login</label>
      <input type="text" id="username" placeholder="Login kiriting" />
    </div>
    <div class="input-group">
      <label>Parol</label>
      <input type="password" id="password" placeholder="Parol kiriting" onkeydown="if(event.key==='Enter')login()" />
    </div>
    <button class="login-btn" onclick="login()">Kirish</button>
    <div class="error-msg" id="error-msg">Login yoki parol noto'g'ri!</div>
  </div>
</div>

<!-- ADMIN PAGE -->
<div id="admin-page">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🎓</div>
      <div class="topbar-title">MK <span>Academia</span></div>
    </div>
    <button class="logout-btn" onclick="logout()">Chiqish</button>
  </div>

  <div class="main-content">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Jami lidlar</div>
        <div class="stat-value blue" id="total-count">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Bugungi lidlar</div>
        <div class="stat-value green" id="today-count">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Oxirgi yangilanish</div>
        <div class="stat-value" id="last-update" style="font-size:16px;padding-top:8px;">—</div>
      </div>
    </div>

    <div class="leads-card">
      <div class="leads-header">
        <h2>📋 Lidlar ro'yxati</h2>
        <button class="refresh-btn" onclick="loadLeads()">🔄 Yangilash</button>
      </div>
      <div id="leads-container">
        <div class="loading">
          <div class="loading-spinner"></div>
          <div>Yuklanmoqda...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const USERNAME = "Islombek";
  const PASSWORD = "hibro.07";
  const SHEET_ID = "1IMDh591jjw55_Q62Y74TTv5BvFVNL5UJsoJdRy8Kd_M";
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlcEHJFqLWdv1Ll-soX6Ci-MiP4t4DFq1YcJCekoK1kBw7LUa9lCd6c5wkIBHseMIS/exec";

  function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    if (u === USERNAME && p === PASSWORD) {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('admin-page').style.display = 'block';
      loadLeads();
    } else {
      document.getElementById('error-msg').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('login-page').style.display = 'flex';
    document.getElementById('admin-page').style.display = 'none';
  }

  async function loadLeads() {
    document.getElementById('leads-container').innerHTML = `
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Yuklanmoqda...</div>
      </div>`;

    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;

      if (!rows || rows.length === 0) {
        document.getElementById('leads-container').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div>Hali lidlar yo'q</div>
          </div>`;
        document.getElementById('total-count').textContent = '0';
        document.getElementById('today-count').textContent = '0';
        return;
      }

      const today = new Date().toLocaleDateString('uz-UZ');
      let todayCount = 0;
      let tableHTML = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Sana</th>
              <th>Ism</th>
              <th>Telefon</th>
            </tr>
          </thead>
          <tbody>`;

      const reversed = [...rows].reverse();
      reversed.forEach((row, i) => {
        const date = row.c[0]?.v || '—';
        const name = row.c[1]?.v || '—';
        const phone = row.c[2]?.v || '—';
        if (date.includes(today.split('.')[0])) todayCount++;
        tableHTML += `
          <tr>
            <td><span class="badge">${rows.length - i}</span></td>
            <td>${date}</td>
            <td><strong>${name}</strong></td>
            <td>📞 ${phone}</td>
          </tr>`;
      });

      tableHTML += '</tbody></table>';
      document.getElementById('leads-container').innerHTML = tableHTML;
      document.getElementById('total-count').textContent = rows.length;
      document.getElementById('today-count').textContent = todayCount;
      document.getElementById('last-update').textContent = new Date().toLocaleTimeString('uz-UZ');

    } catch (err) {
      document.getElementById('leads-container').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <div>Xatolik yuz berdi. Qayta urinib ko'ring.</div>
        </div>`;
    }
  }
</script>
</body>
</html>
